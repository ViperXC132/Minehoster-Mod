name: Build Minehoster

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-disabled: true

      - name: Build
        run: gradle --no-daemon --refresh-dependencies build

      - name: Upload Minehoster JAR
        uses: actions/upload-artifact@v4
        with:
          name: minehoster
          path: build/libs/*.jar
          if-no-files-found: error
